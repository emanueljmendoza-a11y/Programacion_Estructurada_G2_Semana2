<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi pagina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="...">
</head>
<body>
    <div class="container mt-3">
        <form action="/" method="POST">
            <label for="txtGrade" class="form-label text-info">Nota</label>
            <input type="text" id="txtGrade" name="txtGrade" placeholder="0 - 100" class="form-control">
            <button type="submit" class="btn btn-outline-success mt-3">Evaluar</button>
        </form>

        {% if answer %}
        <h3> {{ answer }} </h3>
        {% endif %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="..."></script>
</body>
</html>
